# Dependabot for mmntmnet/hermes-agent (a fork).
#
# Scope is deliberately narrow. Upstream owns the Python and npm dependency
# choices — 233 locked packages across 52 optional groups plus five npm
# manifests — and bumps them constantly. Version-update PRs against those would
# collide with every upstream sync and drown the signal we actually want.
#
# What covers the risk instead:
#   - Dependabot SECURITY updates (enabled on the repo, no config needed) still
#     open PRs for known CVEs in pip and npm. That is the part worth having.
#   - Socket.dev reviews the dependency DIFF on each upstream-sync PR for
#     changed capabilities — install scripts, network/filesystem/shell access,
#     env-var reads. Version numbers are not the threat; behaviour changes are.
#
# So the only thing tracked here is github-actions: the actions used by OUR
# added workflow, which upstream does not maintain and no sync will update.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
